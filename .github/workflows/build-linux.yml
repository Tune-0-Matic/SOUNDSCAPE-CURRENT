name: Build Linux DSP library

# Builds libsoundscape_dsp for Linux, which is the one artifact the Windows development
# machine cannot produce: w64devkit emits PE objects only, and there is no WSL distribution
# or container runtime on it. Everything else about the Linux build -- the .gdextension
# entries, the Linux/X11 export preset, the export templates -- is already in place, and the
# export fails on precisely this file and nothing else.
#
# WHAT TO DO WITH THE RESULT: download the `linux-dsp-libraries` artifact, drop both .so
# files into bin/, and run the Linux export locally. The export is deliberately NOT done
# here -- it would mean pulling ~1 GB of Godot export templates into a runner to produce a
# package whose presets and paths live on the development machine anyway.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '.github/workflows/build-linux.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release]

    steps:
      - name: Check out SOUNDSCAPE
        uses: actions/checkout@v4

      # PINNED, and it has to be. extension/SConstruct passes api_version 4.7 so the bindings
      # match compatibility_minimum in soundscape.gdextension; a godot-cpp that has moved on
      # generates bindings this engine loads and then crashes on, at the first call into a
      # method whose hash moved. This is the revision the Windows libraries were built from.
      - name: Check out godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: 6cceaf6a5f8b0d78ac5d71c139fd7fabba43b918
          path: godot-cpp-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install --upgrade scons

      - name: Build ${{ matrix.target }}
        working-directory: extension
        run: scons godot_cpp_dir=../godot-cpp-src target=${{ matrix.target }} platform=linux arch=x86_64 -j$(nproc)

      # A GDExtension whose entry symbol does not match loads successfully and registers
      # nothing -- no error, anywhere. soundscape.gdextension says so and test_ss_effect.gd
      # checks for the class rather than assuming the load worked; this is the same check,
      # one step earlier, where it costs nothing.
      - name: Verify the library
        run: |
          so="bin/libsoundscape_dsp.linux.${{ matrix.target }}.x86_64.so"
          test -f "$so" || { echo "::error::$so was not produced"; exit 1; }
          file "$so"
          file "$so" | grep -q "ELF 64-bit LSB shared object, x86-64" \
            || { echo "::error::$so is not an x86-64 ELF shared object"; exit 1; }
          nm -D --defined-only "$so" | grep -qw soundscape_dsp_init \
            || { echo "::error::$so does not export soundscape_dsp_init (entry_symbol in soundscape.gdextension)"; exit 1; }
          echo "OK: $(du -h "$so" | cut -f1), exports soundscape_dsp_init"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dsp-${{ matrix.target }}
          path: bin/libsoundscape_dsp.linux.${{ matrix.target }}.x86_64.so
          if-no-files-found: error

  # One artifact holding both, so it drops straight into bin/ without picking through two
  # downloads.
  bundle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-dsp-*
          merge-multiple: true
          path: bin
      - run: ls -la bin
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dsp-libraries
          path: bin/*.so
          if-no-files-found: error
